name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Runs the ledger contract tests against a real Redis as well.
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:licenses
      - run: npm audit --omit=dev --audit-level=high
      - name: Pack, install and import (ESM, CommonJS, TypeScript)
        run: npm run test:pack

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit in the pull request is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t realtime-voice-guard:ci .
      - name: Start and probe /health
        run: |
          docker run -d --name guard -p 8080:8080 \
            -e OPENAI_API_KEY=unused \
            -e GUARD_SIGNING_SECRET="$(openssl rand -hex 32)" \
            -e GUARD_API_KEY="$(openssl rand -hex 32)" \
            realtime-voice-guard:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs guard
          exit 1
      - name: Fail fast on missing config
        run: |
          if docker run --rm realtime-voice-guard:ci 2> err.log; then exit 1; fi
          grep -q '"variable":"OPENAI_API_KEY"' err.log

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .
